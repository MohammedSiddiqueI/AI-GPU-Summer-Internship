<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Interactive Matrix Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

        :root {
            /* Cyberpunk Neon Palette */
            --bg-body: #0a0a12;
            --bg-terminal: #0d0d1a;
            --neon-green: #39ff14;
            --neon-magenta: #ff007f;
            --neon-cyan: #00f0ff;
            --neon-yellow: #fffb00;
            --neon-orange: #ff5500;
            --text-neon: #00f0ff;
            --key-border: #1a1a3a;
        }

        body {
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 50% 30%, #141430 0%, transparent 70%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 100%, 100% 4px, 6px 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
        }

        /* Main Workspace Container */
        .terminal-container {
            position: relative;
            background-color: var(--bg-terminal);
            padding: 30px;
            border-radius: 12px;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Top Bar Layout */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 824px;
            height: 65px; /* Fixed height to anchor layout when input expands */
        }

        /* Pill Toggle Switch positioned on the Top Left */
        .toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--neon-cyan);
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
            user-select: none;
            margin-bottom: 5px; /* Aligns visually right above the ~ key */
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 55px;
            height: 28px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1a1a34;
            border: 1px solid var(--neon-magenta);
            transition: .3s;
            border-radius: 28px;
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.3);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: var(--neon-magenta);
            transition: .3s;
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-magenta);
        }

        /* ON State (Left Aligned Indicator) */
        input:checked + .slider {
            border-color: var(--neon-green);
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.5);
        }

        input:checked + .slider:before {
            background-color: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
            transform: translateX(0);
        }

        /* OFF State (Right Aligned Indicator) */
        input:not(:checked) + .slider:before {
            transform: translateX(27px);
        }

        /* Cyberpunk Input Box */
        .input-container {
            width: 680px;
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.4s ease;
        }

        .input-container.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .typing-display {
            width: 100%;
            padding: 10px 15px;
            font-size: 20px;
            font-family: 'Share Tech Mono', monospace;
            background-color: #05050a;
            border: 1px solid var(--neon-cyan);
            border-radius: 4px;
            color: #fff;
            text-shadow: 0 0 5px var(--neon-cyan);
            box-sizing: border-box;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        /* Keyboard Chassis */
        .keyboard {
            background-color: #07070f;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #1f1f42;
            display: flex;
            flex-direction: column;
            gap: 6px;
            user-select: none;
        }

        .row {
            display: flex;
            gap: 6px;
        }

        /* Base Cyberpunk Key Engine */
        .key {
            border: 1px solid var(--key-border);
            border-radius: 4px;
            color: #8c8caf;
            height: 52px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
            box-sizing: border-box;
            position: relative;
            background-color: #101026;
            /* Default 0.75s transition to fade back safely */
            transition: background-color 0.75s ease, border-color 0.75s ease, box-shadow 0.75s ease, color 0.75s ease, transform 0.1s ease;
        }

        /* Tactile bumps transformed into neon tracking nodes */
        .key.bump::after {
            content: '';
            position: absolute;
            bottom: 8px;
            width: 4px;
            height: 4px;
            background-color: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--neon-cyan);
        }

        /* Sizing Layout Arrays */
        .key.standard { width: 45px; }
        .key.double-label { font-size: 11px; justify-content: space-around; padding: 2px 0; font-family: 'Share Tech Mono', monospace;}
        .key.backspace { width: 112px; }
        .key.tab { width: 70px; }
        .key.backslash { width: 62px; }
        .key.caps { width: 85px; }
        .key.enter { width: 110px; }
        .key.left-shift { width: 106px; }
        .key.right-shift { width: 142px; }
        .key.modifier { width: 65px; }
        .key.space { width: 512px; }

        /* Cyber Theme Color Coding Zone Accents (Subtle resting state borders) */
        .zone-yg { border-color: rgba(203, 212, 73, 0.3); }
        .zone-or { border-color: rgba(255, 85, 0, 0.3); }
        .zone-tl { border-color: rgba(0, 240, 255, 0.3); }
        .zone-pk { border-color: rgba(255, 0, 127, 0.3); }
        .zone-cr { border-color: rgba(57, 255, 20, 0.2); }

        /* ACTIVE TYPING GLOW HIGHLIGHT STATE (Overriding instantly on Keydown) */
        .key.active {
            background-color: #fff !important;
            border-color: #fff !important;
            color: #000 !important;
            box-shadow: 0 0 20px #fff, 0 0 40px var(--neon-cyan);
            transform: scale(0.95);
            text-shadow: none;
            transition: none; /* Forces instant white flash */
        }
    </style>
</head>

                <div class="key standard zone-pk" data-key="KeyH">H</div>
                <div class="key standard bump zone-pk" data-key="KeyJ">J</div>
                <div class="key standard zone-or" data-key="KeyK">K</div>
                <div class="key standard zone-yg" data-key="KeyL">L</div>
                <div class="key standard double-label" data-key="Semicolon"><span>:</span><span>;</span></div>
                <div class="key standard double-label" data-key="Quote"><span>"</span><span>'</span></div>
                <div class="key enter" data-key="Enter">ENTER</div>
            </div>

            <div class="row">
                <div class="key left-shift" data-key="ShiftLeft">SHIFT</div>
                <div class="key standard" data-key="KeyZ">Z</div>
                <div class="key standard zone-yg" data-key="KeyX">X</div>
                <div class="key standard zone-or" data-key="KeyC">C</div>
                <div class="key standard zone-tl" data-key="KeyV">V</div>
                <div class="key standard zone-tl" data-key="KeyB">B</div>
                <div class="key standard zone-pk" data-key="KeyN">N</div>
                <div class="key standard zone-pk" data-key="KeyM">M</div>
                <div class="key standard double-label zone-or" data-key="Comma"><span>&lt;</span><span>,</span></div>
                <div class="key standard double-label zone-yg" data-key="Period"><span>&gt;</span><span>.</span></div>
                <div class="key standard double-label" data-key="Slash"><span>?</span><span>/</span></div>
                <div class="key right-shift" data-key="ShiftRight">SHIFT</div>
            </div>

            <div class="row">
                <div class="key modifier" data-key="ControlLeft">CTRL</div>
                <div class="key modifier" data-key="AltLeft">ALT</div>
                <div class="key space zone-cr" data-key="Space"></div>
                <div class="key modifier" data-key="AltRight">ALT</div>
                <div class="key modifier" data-key="ControlRight">CTRL</div>
            </div>
        </div>
    </div>

    <script>
        const toggleVisibility = document.getElementById('toggleVisibility');
        const inputContainer = document.getElementById('inputContainer');
        const displayInput = document.getElementById('display');

        // Toggle visibility handler (Left Position = True/ON, Right Position = False/OFF)
        toggleVisibility.addEventListener('change', () => {
            if (toggleVisibility.checked) {
                inputContainer.classList.add('visible');
                setTimeout(() => displayInput.focus(), 150);
            } else {
                inputContainer.classList.remove('visible');
                displayInput.blur();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            if(toggleVisibility.checked) displayInput.focus();
        });

        // Dynamic key listeners
        window.addEventListener('keydown', (e) => {
            const keyElement = document.querySelector(`[data-key="${e.code}"]`);
            
            if (keyElement) {
                if (toggleVisibility.checked && document.activeElement !== displayInput) {
                    displayInput.focus();
                }

                if(e.code === 'Tab') {
                    e.preventDefault();
                    if(toggleVisibility.checked) {
                        const start = displayInput.selectionStart;
                        const end = displayInput.selectionEnd;
                        displayInput.value = displayInput.value.substring(0, start) + "\t" + displayInput.value.substring(end);
                        displayInput.selectionStart = displayInput.selectionEnd = start + 1;
                    }
                }
                
                // Triggers immediate white neon flash overrides
                keyElement.classList.add('active');
            }
        });

        window.addEventListener('keyup', (e) => {
            const keyElement = document.querySelector(`[data-key="${e.code}"]`);
            if (keyElement) {
                // Starts the 0.75s transition decay fade back to base styling maps
                keyElement.classList.remove('active');
            }
        });
    </script>
</body>
</html>
